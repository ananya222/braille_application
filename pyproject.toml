[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "braille-app"
version = "0.1.0"
description = "BRF parser, document extractor, and braille comparison pipeline"
requires-python = ">=3.10"
dependencies = [
    "python-docx",
    "pdfplumber",
]

[tool.setuptools.packages.find]
where = ["src"]
